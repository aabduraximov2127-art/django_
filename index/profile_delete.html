<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>System Security Warning</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#05060a;
    font-family:'Rajdhani',sans-serif;
    overflow:hidden;
}

/* BACKGROUND GRID */
body::before{
    content:'';
    position:absolute;
    inset:0;
    background:
        linear-gradient(rgba(255,0,85,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,0,85,0.05) 1px, transparent 1px);
    background-size:40px 40px;
    opacity:.3;
}

/* GLOW ORBS */
.glow{
    position:absolute;
    width:500px;
    height:500px;
    filter:blur(160px);
    opacity:.25;
    z-index:0;
}

.red{background:#ff003c; top:-200px; left:-200px;}
.purple{background:#7c3aed; bottom:-200px; right:-200px;}

/* MAIN CARD */
.card{
    width:520px;
    padding:35px;
    border-radius:18px;
    background:rgba(10,12,20,0.85);
    border:1px solid rgba(255,0,60,0.2);
    box-shadow:0 0 40px rgba(255,0,60,0.15);
    z-index:10;
    position:relative;
    animation:boot 0.8s ease;
}

/* BOOT ANIMATION */
@keyframes boot{
    from{transform:scale(.8); opacity:0;}
    to{transform:scale(1); opacity:1;}
}

/* HEADER */
.header{
    display:flex;
    align-items:center;
    gap:12px;
}

.icon{
    font-size:32px;
    color:#ff003c;
    animation:blink 1s infinite;
}

@keyframes blink{
    50%{opacity:.3;}
}

.title{
    font-family:'Orbitron';
    color:#fff;
    font-size:18px;
    letter-spacing:2px;
}

.subtitle{
    color:#94a3b8;
    font-size:13px;
    margin-top:3px;
}

/* TERMINAL BOX */
.terminal{
    margin-top:20px;
    padding:15px;
    border-radius:12px;
    background:#0a0f1a;
    border:1px solid rgba(255,0,60,0.15);
    font-size:13px;
    color:#22c55e;
    height:120px;
    overflow:hidden;
    font-family:monospace;
}

/* BUTTONS */
.actions{
    margin-top:20px;
    display:flex;
    gap:10px;
}

.btn{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-family:'Orbitron';
    font-weight:700;
    transition:.2s;
}

.danger{
    background:linear-gradient(135deg,#ff003c,#7f001f);
    color:white;
}

.danger:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(255,0,60,0.3);
}

.safe{
    background:#111827;
    color:#cbd5e1;
}

.safe:hover{
    background:#1f2937;
}

/* OVERLAY */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.8);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:100;
}

.overlay.active{
    display:flex;
}

/* MODAL */
.modal{
    width:420px;
    padding:25px;
    border-radius:16px;
    background:#0b0f1c;
    border:1px solid #ff003c;
    text-align:center;
    animation:pop .2s ease;
}

@keyframes pop{
    from{transform:scale(.8); opacity:0;}
    to{transform:scale(1); opacity:1;}
}

.modal h2{
    color:#ff003c;
    font-family:'Orbitron';
}

.modal p{
    color:#94a3b8;
    margin:10px 0;
}

input{
    width:100%;
    padding:12px;
    border-radius:10px;
    background:#050814;
    border:1px solid #1f2937;
    color:white;
    text-align:center;
    letter-spacing:2px;
    outline:none;
}

input:focus{
    border-color:#ff003c;
}

.modal-actions{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.confirm{
    background:#ff003c;
    color:white;
}

.cancel{
    background:#1f2937;
    color:#cbd5e1;
}

.shake{
    animation:shake .3s;
}

@keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-6px);}
    50%{transform:translateX(6px);}
    75%{transform:translateX(-6px);}
}

</style>
</head>

<body>

<div class="glow red"></div>
<div class="glow purple"></div>

<div class="card">

    <div class="header">
        <div class="icon">⚠</div>
        <div>
            <div class="title">SYSTEM DANGER ZONE</div>
            <div class="subtitle">Irreversible action detected</div>
        </div>
    </div>

    <div class="terminal" id="terminal">
> scanning user permissions...
> verifying admin access...
> WARNING: destructive action enabled
> status: CRITICAL
    </div>

    <div class="actions">

        <button class="btn danger" onclick="openModal()">
            INIT DELETE
        </button>

        <a href="{% url 'user_list' %}" class="btn safe" style="text-decoration:none; display:flex; justify-content:center; align-items:center;">
            ABORT
        </a>

    </div>

</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay">

    <div class="modal" id="modal">

        <h2>FINAL SECURITY CHECK</h2>
        <p>Type <b>DELETE</b> to continue</p>

        <input id="input" type="text">

        <div class="modal-actions">

            <button class="btn confirm" onclick="confirmDelete()">
                CONFIRM
            </button>

            <button class="btn cancel" onclick="closeModal()">
                CANCEL
            </button>

        </div>

    </div>

</div>

<form method="POST" id="deleteForm">
    {% csrf_token %}
</form>

<script>

function openModal(){
    document.getElementById("overlay").classList.add("active");
    document.getElementById("input").value="";
    document.getElementById("input").focus();
}

function closeModal(){
    document.getElementById("overlay").classList.remove("active");
}

function confirmDelete(){

    let val = document.getElementById("input").value;
    let modal = document.getElementById("modal");

    if(val === "DELETE"){
        document.getElementById("deleteForm").submit();
    }else{
        modal.classList.add("shake");
        setTimeout(()=>modal.classList.remove("shake"),300);
    }
}

/* fake terminal animation */
const terminal = document.getElementById("terminal");
let lines = [
"> decrypting request...",
"> checking integrity...",
"> system ready..."
];

let i = 0;
setInterval(()=>{
    if(i < lines.length){
        terminal.innerHTML += "\n" + lines[i];
        i++;
    }
}, 1200);

</script>

</body>
</html>
