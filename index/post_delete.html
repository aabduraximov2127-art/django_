{% block title %}Retseptni o‘chirish{% endblock %}

{% block extra_css %}
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#0b0f17;
    --card:rgba(255,255,255,.06);
    --border:rgba(255,255,255,.08);
    --text:#fff;
    --muted:#9ca3af;
    --danger:#ef4444;
    --primary:#f97316;
}

body{
    background:
    radial-gradient(circle at top,#1f2937,transparent 45%),
    radial-gradient(circle at bottom,#7c2d12,transparent 45%),
    var(--bg);
    font-family:Outfit;
    color:var(--text);
}

/* CARD */
.card{
    max-width:520px;
    margin:6rem auto;
    padding:2.5rem;
    border-radius:22px;
    background:var(--card);
    border:1px solid var(--border);
    backdrop-filter:blur(18px);
    text-align:center;
    animation:pop .5s ease;
}

/* ICON */
.icon{
    width:80px;
    height:80px;
    margin:0 auto 1.5rem auto;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(239,68,68,.1);
    border:1px solid rgba(239,68,68,.3);
    font-size:2rem;
    color:var(--danger);
}

/* TITLE */
h2{
    font-size:1.8rem;
    margin-bottom:1rem;
}

/* TEXT */
p{
    color:var(--muted);
    line-height:1.7;
    margin-bottom:2rem;
}

strong{
    color:#fff;
}

/* ACTIONS */
.actions{
    display:flex;
    gap:12px;
    justify-content:center;
}

.btn{
    padding:12px 18px;
    border-radius:12px;
    border:none;
    cursor:pointer;
    font-weight:600;
    transition:.3s;
    text-decoration:none;
}

/* DELETE */
.btn-danger{
    background:var(--danger);
    color:#fff;
}

.btn-danger:hover{
    transform:translateY(-2px);
    background:#dc2626;
}

/* CANCEL */
.btn-cancel{
    background:rgba(255,255,255,.08);
    color:#fff;
}

.btn-cancel:hover{
    background:rgba(255,255,255,.15);
}

/* ANIMATION */
@keyframes pop{
    from{opacity:0;transform:scale(.9) translateY(20px);}
    to{opacity:1;transform:scale(1) translateY(0);}
}

/* MOBILE */
@media(max-width:600px){
    .card{margin:3rem 1rem;}
    .actions{flex-direction:column;}
}
</style>
{% endblock %}

{% block content %}

<div class="card">

    <div class="icon">🗑️</div>

    <h2>Retseptni o‘chirish</h2>

    <p>
        <strong>“{{ post.title }}”</strong> retseptini o‘chirmoqchimisiz? <br>
        Bu amal qaytarilmaydi.
    </p>

    <form method="POST">
        {% csrf_token %}

        <div class="actions">
            <button type="submit" class="btn btn-danger">
                Ha, o‘chirish
            </button>

            <a href="{% url 'post_detail' post.slug %}" class="btn btn-cancel">
                Bekor qilish
            </a>
        </div>
    </form>

</div>

{% endblock %}

<script>
document.addEventListener("DOMContentLoaded", () => {
    const btn = document.getElementById("deleteBtn");

    let timeLeft = 3;

    const interval = setInterval(() => {
        timeLeft--;

        if(timeLeft > 0){
            btn.textContent = `${timeLeft} soniya kuting...`;
        }

        if(timeLeft <= 0){
            clearInterval(interval);
            btn.disabled = false;
            btn.textContent = "Ha, o‘chirish";
            btn.style.background = "#ef4444";
            btn.style.cursor = "pointer";
        }
    }, 1000);

    // 🔥 double confirm (optional safety)
    btn.addEventListener("click", (e) => {
        if(!confirm("Haqiqatan ham o‘chirmoqchimisiz?")) {
            e.preventDefault();
        }
    });
});
</script>
<script>
document.querySelector("form").addEventListener("submit", () => {
    const btn = document.getElementById("deleteBtn");
    btn.innerHTML = "O‘chirilmoqda...";
    btn.style.opacity = "0.7";
});
</script>
