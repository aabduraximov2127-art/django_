<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cyber Post Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#0b1220;
    display:flex;
    justify-content:center;
    padding:40px 15px;
    font-family:'Poppins',sans-serif;
}

/* FEED WRAPPER */
.feed{
    width:100%;
    max-width:600px;
}

/* POST CARD */
.post{
    background:rgba(17,24,39,0.8);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:18px;
    margin-bottom:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
    backdrop-filter:blur(12px);
}

/* HEADER */
.post-header{
    display:flex;
    align-items:center;
    gap:12px;
    padding:15px;
    border-bottom:1px solid rgba(255,255,255,0.05);
}

.avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    overflow:hidden;
    border:2px solid #22d3ee;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.user-info{
    display:flex;
    flex-direction:column;
}

.username{
    color:#fff;
    font-weight:600;
    font-size:14px;
}

.time{
    color:#94a3b8;
    font-size:12px;
}

/* CONTENT */
.post-body{
    padding:18px;
}

.title{
    font-size:18px;
    color:#fff;
    margin-bottom:10px;
    font-weight:600;
}

.text{
    color:#cbd5e1;
    font-size:14px;
    line-height:1.6;
}

/* INFO BOX (BIO STYLE POST CONTENT) */
.info-box{
    margin-top:12px;
    padding:12px;
    border-radius:12px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.05);
    color:#e2e8f0;
    font-size:14px;
}

/* ACTIONS */
.post-actions{
    display:flex;
    gap:10px;
    padding:12px 15px;
    border-top:1px solid rgba(255,255,255,0.05);
}

.btn{
    flex:1;
    text-align:center;
    padding:10px;
    border-radius:10px;
    text-decoration:none;
    font-size:13px;
    font-weight:600;
    color:white;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-2px);
    filter:brightness(1.1);
}

.edit{background:linear-gradient(135deg,#06b6d4,#3b82f6);}
.update{background:linear-gradient(135deg,#8b5cf6,#ec4899);}
.delete{background:linear-gradient(135deg,#ef4444,#dc2626);}
.view{background:linear-gradient(135deg,#22c55e,#16a34a);}

.website a{
    color:#38bdf8;
    text-decoration:none;
}

.website a:hover{
    text-decoration:underline;
}

/* RESPONSIVE */
@media(max-width:600px){
    .post-actions{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div class="feed">

    <!-- POST -->
    <div class="post">

        <!-- HEADER -->
        <div class="post-header">
            <div class="avatar">
                {% if user.avatar %}
                    <img src="{{ user.avatar.url }}">
                {% else %}
                    <img src="https://i.imgur.com/6VBx3io.png">
                {% endif %}
            </div>

            <div class="user-info">
                <div class="username">{{ user.username }}</div>
                <div class="time">Cyber user profile</div>
            </div>
        </div>

        <!-- BODY -->
        <div class="post-body">

            <div class="title">Profile Bio</div>

            <div class="text">
                {{ profile.bio|default:"No bio added yet..." }}
            </div>

            <div class="info-box website">
                <strong>Website:</strong><br>
                {% if profile.website %}
                    <a href="{{ profile.website }}" target="_blank">
                        {{ profile.website }}
                    </a>
                {% else %}
                    No website added
                {% endif %}
            </div>

        </div>

        <!-- ACTIONS -->
        <div class="post-actions">

            <a href="{% url 'user_detail' slug=user.slug %}" class="btn view">
                View
            </a>

            <a href="{% url 'profile_update' slug=user.slug %}" class="btn update">
                Edit
            </a>

            <a href="{% url 'profile_delete' slug=user.slug %}" class="btn delete">
                Delete
            </a>

        </div>

    </div>

</div>

</body>
</html>
