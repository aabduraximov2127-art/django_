<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Update Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter', sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: radial-gradient(circle at top, #1e293b, #0b1220);
    color:#e5e7eb;
}

/* BACK CARD */
.wrapper{
    width:520px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:22px;
    backdrop-filter:blur(18px);
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
    overflow:hidden;
}

/* HEADER */
.header{
    padding:25px;
    background:linear-gradient(135deg,#6366f1,#22c55e);
    color:white;
}

.header h1{
    font-size:20px;
    font-weight:600;
}

.header p{
    font-size:12px;
    opacity:.8;
    margin-top:5px;
}

/* FORM */
.form{
    padding:25px;
    display:flex;
    flex-direction:column;
    gap:18px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:6px;
}

label{
    font-size:12px;
    color:#94a3b8;
    letter-spacing:.5px;
}

input, textarea{
    width:100%;
    padding:12px 14px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.08);
    background:rgba(15,23,42,0.6);
    color:white;
    outline:none;
    transition:.2s;
}

input:focus, textarea:focus{
    border-color:#6366f1;
    box-shadow:0 0 0 3px rgba(99,102,241,0.15);
}

textarea{
    resize:none;
    height:90px;
}

/* BUTTONS */
.actions{
    display:flex;
    gap:10px;
    margin-top:10px;
}

.btn{
    flex:1;
    padding:12px;
    border-radius:12px;
    border:none;
    cursor:pointer;
    font-weight:600;
    transition:.2s;
}

.save{
    background:linear-gradient(135deg,#6366f1,#22c55e);
    color:white;
}

.save:hover{
    transform:translateY(-2px);
    filter:brightness(1.1);
}

.cancel{
    background:rgba(255,255,255,0.05);
    color:#cbd5e1;
    border:1px solid rgba(255,255,255,0.08);
}

.cancel:hover{
    background:rgba(255,255,255,0.08);
}

/* SMALL INFO CARD */
.hint{
    font-size:11px;
    color:#94a3b8;
    margin-top:5px;
}

a{
    text-decoration:none;
}

</style>
</head>

<body>

<div class="wrapper">

    <!-- HEADER -->
    <div class="header">
        <h1>Update Profile</h1>
        <p>Manage your personal information</p>
    </div>

    <!-- FORM -->
    <form method="POST" class="form">
        {% csrf_token %}

        <div class="field">
            <label>Bio</label>
            {{ form.bio }}
            <div class="hint">Write something about yourself</div>
        </div>

        <div class="field">
            <label>Website</label>
            {{ form.website }}
            <div class="hint">Your personal or portfolio link</div>
        </div>

        <div class="actions">

            <button type="submit" class="btn save">
                Save Changes
            </button>

            <a href="{% url 'user_list' %}" class="btn cancel" style="display:flex;justify-content:center;align-items:center;">
                Cancel
            </a>

        </div>

    </form>

</div>

</body>
</html>
