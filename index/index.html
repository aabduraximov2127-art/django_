<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Users Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:linear-gradient(135deg,#f8fafc,#eef2ff);
    color:#111827;
    padding:30px;
    opacity:0;
    transform:translateX(50px);
    animation:pageIn .8s ease forwards;
}

@keyframes pageIn{
    to{
        opacity:1;
        transform:translateX(0);
    }
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.logo{
    font-size:22px;
    font-weight:700;
}

.actions-top a{
    text-decoration:none;
    margin-left:10px;
    padding:10px 14px;
    border-radius:12px;
    font-size:13px;
    font-weight:600;
    transition:.3s;
}

.actions-top a:hover{
    transform:translateY(-2px);
}

.create{
    background:#4f46e5;
    color:white;
}

.logout{
    background:#e5e7eb;
    color:#111827;
}

.search input{
    width:100%;
    padding:15px;
    border-radius:14px;
    border:1px solid #e5e7eb;
    outline:none;
    margin-bottom:25px;
    font-size:14px;
    transition:.3s;
}

.search input:focus{
    border-color:#4f46e5;
    box-shadow:0 0 0 4px rgba(79,70,229,.15);
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:18px;
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.06);
    cursor:pointer;
    border:1px solid #f1f5f9;
    transition:.35s;
}

.card:hover{
    transform:translateY(-8px) scale(1.02);
    box-shadow:0 20px 40px rgba(79,70,229,.15);
}

.avatar{
    width:80px;
    height:80px;
    border-radius:50%;
    overflow:hidden;
    margin:auto;
    border:4px solid #eef2ff;
    animation:float 3s ease-in-out infinite;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-8px);
    }
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.info{
    text-align:center;
    margin-top:15px;
}

.info h2{
    font-size:16px;
    margin-bottom:5px;
}

.info p{
    color:#64748b;
    font-size:13px;
}

.actions{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:18px;
}

.actions a{
    text-decoration:none;
    text-align:center;
    padding:10px;
    border-radius:10px;
    font-size:13px;
    font-weight:600;
    transition:.3s;
}

.view{
    background:#4f46e5;
    color:white;
}

.edit{
    background:#f1f5f9;
    color:#111827;
}

.delete{
    background:#fee2e2;
    color:#dc2626;
}

.actions a:hover{
    transform:scale(1.03);
}

.empty{
    grid-column:1/-1;
    text-align:center;
    padding:40px;
    color:#64748b;
}

.card.hidden{
    opacity:0;
    transform:scale(.8);
    pointer-events:none;
}

.card.active{
    box-shadow:0 0 30px rgba(79,70,229,.35);
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <div class="logo">Users</div>

    <div class="actions-top">
        <a href="{% url 'user_create' %}" class="create">+ Create</a>
            <!-- 🔥 NEW: POSTGA O'TISH LINK -->
    <a href="{% url 'post_list' %}" class="create" style="background:rgb(79,70,229,0.1);color:#4f46e5;">
        Retseptlar
    </a>
        <a href="{% url 'logout' %}" class="logout">Logout</a>
    </div>
</div>

<!-- SEARCH -->
<div class="search">
    <input type="text" id="search" placeholder="Search users...">
</div>

<!-- GRID -->
<div class="grid">

{% for user in users %}

<div class="card" data-url="{% url 'user_detail' slug=user.slug %}" data-name="{{ user.first_name|lower }} {{ user.last_name|lower }}">

    <div class="avatar">
        {% if user.avatar %}
            <img src="{{ user.avatar.url }}">
        {% else %}
            <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
        {% endif %}
    </div>

    <div class="info">
        <h2>{{ user.first_name }} {{ user.last_name }}</h2>
        <p>{{ user.phon }}</p>
    </div>

    <div class="actions">

        <!-- 🔥 POST LINK -->
        <a href="{% url 'user_detail' slug=user.slug %}" class="view">
            details
        </a>

        <a href="{% url 'user_update' slug=user.slug %}" class="edit">
        update
        </a>

        <a href="{% url 'user_delete' slug=user.slug %}" class="delete">
            delete
        </a>

    </div>

</div>

{% empty %}
<div class="empty">No users found</div>
{% endfor %}

</div>

<script>

// CARD CLICK
document.querySelectorAll(".card").forEach(card => {

    card.addEventListener("click", e => {

        if(e.target.closest("a")) return;

        document.body.style.transition = ".5s";
        document.body.style.opacity = "0";
        document.body.style.transform = "translateX(-120px)";

        setTimeout(() => {
            window.location.href = card.dataset.url;
        }, 500);

    });

});


// SEARCH ANIMATION
const search = document.getElementById("search");

search.addEventListener("input", e => {

    const value = e.target.value.toLowerCase();

    document.querySelectorAll(".card").forEach(card => {

        const found = card.dataset.name.includes(value);

        if(found){
            card.style.display = "block";

            setTimeout(()=>{
                card.classList.remove("hidden");
            },10);

        }else{

            card.classList.add("hidden");

            setTimeout(()=>{
                if(card.classList.contains("hidden")){
                    card.style.display = "none";
                }
            },300);

        }

    });

});


// RANDOM CARD ANIMATION
setInterval(() => {

    const cards = document.querySelectorAll(".card");

    cards.forEach(c => c.classList.remove("active"));

    const random =
        cards[Math.floor(Math.random() * cards.length)];

    if(random){

        random.classList.add("active");

        random.animate([
            {transform:"translateY(0px)"},
            {transform:"translateY(-10px)"},
            {transform:"translateY(0px)"}
        ],{
            duration:1000
        });

    }

},3000);


// PAGE TRANSITION FOR LINKS
document.querySelectorAll("a").forEach(link => {

    link.addEventListener("click", function(e){

        if(this.target === "_blank") return;

        e.preventDefault();

        const href = this.href;

        document.body.animate([
            {
                opacity:1,
                transform:"translateX(0)"
            },
            {
                opacity:0,
                transform:"translateX(-250px)"
            }
        ],{
            duration:500,
            fill:"forwards"
        });

        setTimeout(()=>{
            window.location.href = href;
        },500);

    });

});

</script>

</body>
</html>
