<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Users Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:#f6f7fb;
    color:#111827;
    padding:30px;
}

/* HEADER */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.logo{
    font-size:20px;
    font-weight:700;
    color:#111827;
}

.actions-top a{
    text-decoration:none;
    margin-left:10px;
    padding:10px 14px;
    border-radius:10px;
    font-size:13px;
    font-weight:600;
}

.create{
    background:#4f46e5;
    color:white;
}

.logout{
    background:#e5e7eb;
    color:#111827;
}

/* SEARCH */
.search input{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #e5e7eb;
    outline:none;
    margin-bottom:25px;
    font-size:14px;
}

.search input:focus{
    border-color:#4f46e5;
    box-shadow:0 0 0 3px rgba(79,70,229,0.15);
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:18px;
}

/* CARD */
.card{
    background:white;
    border-radius:16px;
    padding:18px;
    box-shadow:0 10px 25px rgba(0,0,0,0.06);
    transition:.2s;
    cursor:pointer;
    border:1px solid #f1f1f1;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 15px 35px rgba(0,0,0,0.08);
}

/* AVATAR */
.avatar{
    width:70px;
    height:70px;
    border-radius:50%;
    overflow:hidden;
    margin:auto;
    border:3px solid #e5e7eb;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* INFO */
.info{
    text-align:center;
    margin-top:12px;
}

.info h2{
    font-size:15px;
    font-weight:600;
}

.info p{
    font-size:12px;
    color:#6b7280;
    margin-top:3px;
}

/* BUTTONS */
.actions{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:15px;
}

.actions a{
    text-align:center;
    padding:10px;
    font-size:12px;
    border-radius:10px;
    text-decoration:none;
    font-weight:600;
    transition:.2s;
}

/* MAIN POST LINK */
.view{
    background:#4f46e5;
    color:white;
}

.view:hover{
    background:#4338ca;
}

.edit{
    background:#f3f4f6;
    color:#111827;
}

.edit:hover{
    background:#e5e7eb;
}

.delete{
    background:#fee2e2;
    color:#b91c1c;
}

.delete:hover{
    background:#fecaca;
}

/* EMPTY */
.empty{
    grid-column:1/-1;
    text-align:center;
    padding:40px;
    color:#6b7280;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <div class="logo">Users Dashboard</div>

    <div class="actions-top">
        <a href="{% url 'user_create' %}" class="create">+ Create</a>
            <!-- 🔥 NEW: POSTGA O'TISH LINK -->
    <a href="{% url 'post_list' %}" class="create" style="background:#22c55e;">
        Posts Feed
    </a>
        <a href="{% url 'logout' %}" class="logout">Logout</a>
    </div>
</div>

<!-- SEARCH -->
<div class="search">
    <input type="text" id="search" placeholder="Search users...">
</div>

<!-- GRID -->
<div class="grid">

{% for user in users %}

<div class="card" data-url="{% url 'user_detail' slug=user.slug %}" data-name="{{ user.first_name|lower }} {{ user.last_name|lower }}">

    <div class="avatar">
        {% if user.avatar %}
            <img src="{{ user.avatar.url }}">
        {% else %}
            <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
        {% endif %}
    </div>

    <div class="info">
        <h2>{{ user.first_name }} {{ user.last_name }}</h2>
        <p>{{ user.phon }}</p>
    </div>

    <div class="actions">

        <!-- 🔥 POST LINK -->
        <a href="{% url 'user_detail' slug=user.slug %}" class="view">
            Details
        </a>

        <a href="{% url 'user_update' slug=user.slug %}" class="edit">
            Edit
        </a>

        <a href="{% url 'user_delete' id=user.id %}" class="delete">
            Delete
        </a>

    </div>

</div>

{% empty %}
<div class="empty">No users found</div>
{% endfor %}

</div>

<script>

/* CARD CLICK */
document.querySelectorAll(".card").forEach(card=>{
    card.addEventListener("click",(e)=>{
        if(e.target.tagName === "A") return;
        window.location.href = card.dataset.url;
    });
});

/* SEARCH */
const search = document.getElementById("search");

search.addEventListener("input",(e)=>{
    const val = e.target.value.toLowerCase();

    document.querySelectorAll(".card").forEach(card=>{
        card.style.display = card.dataset.name.includes(val) ? "block" : "none";
    });
});

</script>

</body>
</html>
