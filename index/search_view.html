{% block content %}

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background: radial-gradient(circle at top, #1e293b, #0f172a);
    color:#fff;
}

.container{
    max-width:900px;
    margin:60px auto;
    padding:20px;
}

.search-card{
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    border-radius:16px;
    padding:30px;
}

.search-title{
    font-size:28px;
    font-weight:700;
    margin-bottom:20px;
}

.search-form{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.search-form input{
    flex:1;
    padding:12px 15px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.2);
    background:rgba(255,255,255,0.08);
    color:#fff;
    outline:none;
}

.btn{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#3b82f6,#6366f1);
    color:#fff;
    cursor:pointer;
}

.result-card{
    margin-top:15px;
    padding:15px;
    border-radius:12px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    transition:0.3s;
    display:flex;
    gap:15px;
    align-items:center;
    text-decoration:none;
    color:#fff;
}

.result-card:hover{
    transform:translateY(-3px);
    background:rgba(255,255,255,0.08);
}

.result-card img{
    width:80px;
    height:80px;
    object-fit:cover;
    border-radius:10px;
}
</style>

<div class="container">

    <div class="search-card">

        <h2 class="search-title">🔎 Post qidirish</h2>

        <form method="GET" class="search-form">
            <input type="text" name="q" placeholder="Post qidirish..." value="{{ query }}">
            <button class="btn" type="submit">Qidirish</button>
        </form>

        {% if query %}
            <p style="margin-bottom:10px;">
                <b>{{ posts|length }}</b> ta natija topildi
            </p>

            {% for post in posts %}
                <a href="{% url 'post_detail' post.slug %}" class="result-card">

                    {% if post.images %}
                        <img src="{{ post.images.url }}" alt="{{ post.title }}">
                    {% else %}
                        <img src="https://via.placeholder.com/80" alt="no image">
                    {% endif %}

                    <div>
                        <h3>{{ post.title }}</h3>
                        <p style="opacity:0.7;">
                            {{ post.content|truncatechars:120 }}
                        </p>
                    </div>

                </a>
            {% empty %}
                <p>Hech narsa topilmadi 😕</p>
            {% endfor %}
        {% endif %}

    </div>

</div>

{% endblock %}
